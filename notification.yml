spring:
  application:
    name: notification
  config:
    activate:
      on-profile: default
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: notification-service-group
      auto-offset-reset: earliest
eureka:
  instance:
    preferIpAddress: true
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka
kafka:
  topics:
    account-created: email-account-created-topic
